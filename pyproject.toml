[project]
name = "apx-github"
version = "0.1.0"
description = "Action Platform plugin for GitHub: organization access and read-only checks of branch protection and repository settings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.33"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "action-platform[mcp]"]

[project.entry-points."action_platform.plugins"]
github = "apx_github:GitHubPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apx_github*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
